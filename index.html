<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DLP rollout progression</title>
  <style>
    :root {
      --progress: 40;
      --current: 40;
      --bg: #0f1115;
      --track: #252a33;
      --fill-start: #ff8a3d;
      --fill-end: #ffd23f;
      --text: #f2f2f2;
      --muted: #8a919e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3rem;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 2rem;
    }

    h1 {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }

    .progress {
      width: min(900px, 90vw);
      cursor: grab;
      touch-action: none;
      user-select: none;
      outline: none;
    }

    .progress.dragging { cursor: grabbing; }

    .progress:focus-visible .face img {
      outline: 3px solid var(--text);
      outline-offset: 4px;
    }

    .rail {
      position: relative;
      height: 220px;
    }

    .face {
      position: absolute;
      bottom: 0;
      left: calc(var(--progress) * 1%);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .face img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid var(--fill-end);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .face::after {
      content: "";
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 14px solid var(--fill-end);
      margin-top: 6px;
    }

    .bar {
      position: relative;
      height: 28px;
      background: var(--track);
      border-radius: 999px;
      overflow: hidden;
    }

    .fill {
      width: calc(var(--progress) * 1%);
      height: 100%;
      background: linear-gradient(90deg, var(--fill-start), var(--fill-end));
      border-radius: 999px;
    }

    .scale {
      position: relative;
      display: flex;
      justify-content: space-between;
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
    }

    .marker {
      position: absolute;
      top: -0.25rem;
      left: calc(var(--current) * 1%);
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      color: var(--fill-end);
      font-weight: 700;
      white-space: nowrap;
      pointer-events: none;
    }

    .marker::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 10px solid var(--fill-end);
    }

    .value {
      font-size: 2.5rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      text-align: center;
      margin-top: 1.5rem;
    }
  </style>
</head>

    const root = document.documentElement;
    const progress = document.getElementById("progress");
    const bar = document.getElementById("bar");
    const frame = document.getElementById("frame");
    const value = document.getElementById("value");

    const HOME = parseFloat(getComputedStyle(root).getPropertyValue("--current"));
    const SLIDE_BACK_MS = 600;
    let slideBack = null;

    function setProgress(percent) {
      const p = Math.min(100, Math.max(0, percent));
      const index = Math.round((p / 100) * (FRAMES.length - 1));
      root.style.setProperty("--progress", p);
      frame.src = "data:image/jpeg;base64," + FRAMES[index];
      value.textContent = Math.round(p) + "%";
      progress.setAttribute("aria-valuenow", Math.round(p));
      return p;
    }

    function stopSlideBack() {
      cancelAnimationFrame(slideBack);
      slideBack = null;
    }

    function startSlideBack() {
      const from = current;
      const start = performance.now();

      function step(now) {
        const t = Math.min(1, (now - start) / SLIDE_BACK_MS);
        const eased = 1 - Math.pow(1 - t, 3);
        current = setProgress(from + (HOME - from) * eased);
        slideBack = t < 1 ? requestAnimationFrame(step) : null;
      }

      stopSlideBack();
      slideBack = requestAnimationFrame(step);
    }

    function percentFromPointer(event) {
      const rect = bar.getBoundingClientRect();
      return ((event.clientX - rect.left) / rect.width) * 100;
    }

    let current = setProgress(HOME);

    progress.addEventListener("pointerdown", (event) => {
      stopSlideBack();
      progress.setPointerCapture(event.pointerId);
      progress.classList.add("dragging");
      current = setProgress(percentFromPointer(event));
    });

    progress.addEventListener("pointermove", (event) => {
      if (progress.hasPointerCapture(event.pointerId)) {
        current = setProgress(percentFromPointer(event));
      }
    });

    function release() {
      progress.classList.remove("dragging");
      startSlideBack();
    }

    progress.addEventListener("pointerup", release);
    progress.addEventListener("pointercancel", release);

    progress.addEventListener("keydown", (event) => {
      const steps = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -10, PageUp: 10 };
      if (event.key in steps) {
        stopSlideBack();
        current = setProgress(current + steps[event.key]);
      } else if (event.key === "Home") {
        stopSlideBack();
        current = setProgress(0);
      } else if (event.key === "End") {
        stopSlideBack();
        current = setProgress(100);
      } else {
        return;
      }
      event.preventDefault();
    });
